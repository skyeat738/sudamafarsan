name: Deploy Sudama Farsan

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Upload Laravel application
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}

          source: "app,bootstrap,config,database,public,resources,routes,artisan,composer.json,composer.lock"
          target: "/home/u310066937/domains/skynetitsolutions.com/public_html/sudamafarsan"

          overwrite: true
          rm: false

      - name: Run Laravel deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          command_timeout: 20m

          script: |
            set -e

            TARGET="/home/u310066937/domains/skynetitsolutions.com/public_html/sudamafarsan"

            echo "================================="
            echo "DEPLOYING SUDAMA FARSAN"
            echo "================================="

            cd "$TARGET"

            echo "Directory:"
            pwd

            echo "Checking Laravel:"
            test -f artisan
            test -f composer.json

            echo "Installing Composer dependencies..."

            composer install \
              --no-dev \
              --prefer-dist \
              --optimize-autoloader \
              --no-interaction \
              --no-scripts

            echo "Laravel version:"
            php artisan --version

            echo "Clearing caches..."
            php artisan optimize:clear

            echo "Caching configuration..."
            php artisan config:cache

            echo "Caching routes..."
            php artisan route:cache

            echo "Caching views..."
            php artisan view:cache

            echo "================================="
            echo "DEPLOYMENT SUCCESSFUL"
            echo "================================="
