name: Deploy Sudama Farsan

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout project
        uses: actions/checkout@v4

      # ==========================================
      # 2. Create clean deployment folder
      # ==========================================
      - name: Prepare deployment files
        run: |
          set -e

          echo "=== Creating clean deployment directory ==="

          mkdir -p deploy

          rsync -av \
            --exclude='.git' \
            --exclude='deploy' \
            --exclude='.env' \
            --exclude='vendor' \
            ./ deploy/

          echo "=== Deployment files ==="
          find deploy -maxdepth 2 -type f | sort

      # ==========================================
      # 3. Upload project to Hostinger
      # ==========================================
      - name: Upload project
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}

          source: "deploy/*"
          target: "/home/u310066937/domains/skynetitsolutions.com/public_html/sudamafarsan"

          overwrite: true
          timeout: 2m
          command_timeout: 20m

      # ==========================================
      # 4. Run Laravel deployment
      # ==========================================
      - name: Install and configure Laravel
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}

          command_timeout: 20m

          script: |
            set -e

            TARGET="/home/u310066937/domains/skynetitsolutions.com/public_html/sudamafarsan"

            echo "================================="
            echo "   DEPLOYING SUDAMA FARSAN"
            echo "================================="

            cd "$TARGET"

            echo "=== Current Directory ==="
            pwd

            echo "=== Project Files ==="
            ls -la

            echo "=== Checking Laravel files ==="

            test -f composer.json
            test -f artisan
            test -f bootstrap/app.php

            echo "composer.json FOUND"
            echo "artisan FOUND"
            echo "bootstrap/app.php FOUND"

            echo "=== PHP Version ==="
            php -v

            echo "=== Composer Version ==="
            composer --version

            echo "=== Composer Install ==="

             composer install \
                          --no-dev \
                          --prefer-dist \
                          --optimize-autoloader \
                          --no-interaction \
                          --no-scripts

            echo "=== Laravel Version ==="
            php artisan --version

            echo "=== Generate Application Key ==="

            if [ -f .env ]; then
                php artisan key:generate --force
            else
                echo ".env not found"
                echo "Please create .env on Hostinger first"
                exit 1
            fi

            echo "=== Storage Link ==="

            php artisan storage:link || true

            echo "=== Clear Laravel Cache ==="

            php artisan optimize:clear

            echo "=== Cache Laravel Configuration ==="

            php artisan config:cache

            echo "=== Cache Laravel Routes ==="

            php artisan route:cache

            echo "=== Cache Laravel Views ==="

            php artisan view:cache

            echo "================================="
            echo "   DEPLOYMENT SUCCESSFUL"
            echo "================================="
